name: Backend Test And Security

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    # Defensive gating: only run if this is actually a PR context
    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Run backend tests
        run: npm test

      - name: Write test summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Backend Test Results"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ Build and tests **passed**."
            else
              echo "❌ Build or tests **failed** — see step logs above for details."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  security:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run security audit
        id: audit
        run: npm audit --omit=dev
        continue-on-error: true
      
      - name: Install Copilot CLI extension
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh extension install github/gh-copilot || true

      - name: Run security reviewer
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }} # Requires a PAT with Copilot privileges
        run: |
          gh copilot explain -p "Using @security-reviewer, review the code changes for security vulnerabilities."
