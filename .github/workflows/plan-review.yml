name: Plan Review

on:
  workflow_run:
    workflows: ["Plan Gate"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  review-plan:
    # Only run when Plan Gate succeeded and was triggered by a PR event
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download durable plan artifact from triggering run
        uses: actions/github-script@v7
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run_id = process.env.RUN_ID;

            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id, per_page: 100 }
            );

            const artifact = artifacts.find(a => a.name === 'plan-durable');
            if (!artifact) {
              core.setFailed('Artifact "plan-durable" not found.');
              return;
            }

            const zip = await github.rest.actions.downloadArtifact({
              owner,
              repo,
              artifact_id: artifact.id,
              archive_format: 'zip'
            });

            fs.writeFileSync(
              path.join(process.env.GITHUB_WORKSPACE, 'plan-durable.zip'),
              Buffer.from(zip.data)
            );

      - name: Unzip durable plan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y unzip
          unzip -o plan-durable.zip -d .
          test -f plan-durable.md || { echo "plan-durable.md not found after unzip"; exit 1; }
          test -s plan-durable.md || { echo "plan-durable.md is empty"; exit 1; }

      - name: Print plan preview
        run: |
          echo "=== plan-durable.md (first 120 lines) ==="
          sed -n '1,120p' plan-durable.md

      - name: Review plan content
        run: |
          set -euo pipefail

          test -s plan-durable.md || { echo "plan-durable.md is empty"; exit 1; }

          # Example quality gates (customize to your policy)
          grep -q "^## " plan-durable.md || { echo "Missing section headings"; exit 1; }
          # Accept common Markdown heading variants (Acceptance Criteria, Done Criteria, etc.) without dropping the gate.
          grep -Eqi '^[[:space:]]*#{1,6}[[:space:]]+(acceptance criteri(a|on)|success criteria|definition of done|done criteria)([[:space:][:punct:]]|$)' plan-durable.md || { echo "Missing acceptance criteria section"; exit 1; }

          echo "Plan review checks passed."
