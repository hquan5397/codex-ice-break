name: Plan Review

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review-plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify PLAN.md exists and is non-empty
        run: |
          if [ ! -f "PLAN.md" ]; then
            echo "ERROR: PLAN.md not found in the repository root."
            exit 1
          fi
          if [ ! -s "PLAN.md" ]; then
            echo "ERROR: PLAN.md exists but is empty."
            exit 1
          fi
          echo "PLAN.md found and is non-empty."

      - name: Review plan content
        id: review
        run: |
          set -euo pipefail

          PLAN_FILE="PLAN.md"

          # ── Quality gates ────────────────────────────────────────────────────
          HAS_HEADINGS=false
          HAS_ACCEPTANCE=false
          ISSUES=()

          grep -q "^## " "$PLAN_FILE" && HAS_HEADINGS=true || ISSUES+=("Missing section headings (no '## ' found)")

          grep -Eqi \
            '^[[:space:]]*#{1,6}[[:space:]]+(acceptance criteri(a|on)|success criteria|definition of done|done criteria)([[:space:][:punct:]]|$)' \
            "$PLAN_FILE" && HAS_ACCEPTANCE=true || ISSUES+=("Missing acceptance criteria section")

          # ── Collect basic stats ───────────────────────────────────────────────
          TOTAL_LINES=$(wc -l < "$PLAN_FILE")
          SECTION_COUNT=$(grep -c "^## " "$PLAN_FILE" || true)

          # ── Build the human-readable report ──────────────────────────────────
          {
            echo "## 📋 Plan Review Report"
            echo ""
            echo "### Pull Request"
            echo "- **PR:** #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.title }}"
            echo "- **Author:** @${{ github.actor }}"
            echo "- **Branch:** \`${{ github.head_ref }}\` → \`${{ github.base_ref }}\`"
            echo "- **SHA:** \`${{ github.event.pull_request.head.sha }}\`"
            echo ""
            echo "### Plan Statistics"
            echo "- Total lines in PLAN.md: **${TOTAL_LINES}**"
            echo "- Top-level sections (\`## \`): **${SECTION_COUNT}**"
            echo ""
            echo "### Quality Gate Results"

            if $HAS_HEADINGS; then
              echo "- ✅ Section headings present"
            else
              echo "- ❌ Section headings missing"
            fi

            if $HAS_ACCEPTANCE; then
              echo "- ✅ Acceptance criteria section found"
            else
              echo "- ❌ Acceptance criteria section missing"
            fi

            echo ""
            if [ ${#ISSUES[@]} -eq 0 ]; then
              echo "### ✅ Overall Result: PASSED"
              echo ""
              echo "All plan review checks passed. The plan is ready for human review."
            else
              echo "### ❌ Overall Result: FAILED"
              echo ""
              echo "The following issues must be resolved before this PR can proceed:"
              for issue in "${ISSUES[@]}"; do
                echo "- $issue"
              done
            fi

            echo ""
            echo "---"
            echo "### PLAN.md Preview (first 120 lines)"
            echo ""
            echo '```markdown'
            sed -n '1,120p' "$PLAN_FILE"
            echo '```'
          } | tee /tmp/plan-review-report.md

          # Publish to the workflow summary
          cat /tmp/plan-review-report.md >> "$GITHUB_STEP_SUMMARY"

          # Fail the job if any quality gate did not pass
          if [ ${#ISSUES[@]} -gt 0 ]; then
            echo ""
            echo "Plan review failed with ${#ISSUES[@]} issue(s). See report above."
            exit 1
          fi
