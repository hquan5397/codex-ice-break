name: Plan Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  require-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require PLAN.md
        run: |
          if [ ! -f "PLAN.md" ]; then
            echo "PLAN.md is required for this pull request."
            exit 1
          fi
          echo "PLAN.md found."

      - name: Export durable plan markdown
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          {
            echo "# Durable Plan"
            echo
            echo "Generated by workflow: \`${{ github.workflow }}\`"
            echo
            echo "- Repository: \`${REPO}\`"
            echo "- PR: #${PR_NUMBER}"
            echo "- Title: ${PR_TITLE}"
            echo "- URL: ${PR_URL}"
            echo "- Author: ${ACTOR}"
            echo "- Head branch: \`${PR_HEAD_REF}\`"
            echo "- Head SHA: \`${PR_HEAD_SHA}\`"
            echo "- Base branch: \`${PR_BASE_REF}\`"
            echo
            echo "## Plan Content (from \`PLAN.md\`)"
            echo
            cat PLAN.md
          } > plan-durable.md

          test -s plan-durable.md || { echo "plan-durable.md is empty"; exit 1; }

      - name: Upload durable plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: plan-durable
          path: plan-durable.md
          if-no-files-found: error
          retention-days: 30
